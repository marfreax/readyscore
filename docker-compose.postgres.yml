services:
  postgres:
    image: postgres:16
    container_name: readyscore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: readyscore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: readyscore
    ports:
      - "5433:5432"
    volumes:
      - readyscore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readyscore -d readyscore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  readyscore-postgres-data:
